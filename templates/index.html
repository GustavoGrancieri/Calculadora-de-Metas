<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
    <!-- Fonte bonita -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <video autoplay muted loop id="video-fundo">
        <source src="{{ url_for('static', filename='Background.mp4') }}" type="video/mp4">
    </video>

    <div class="container">
        <h1>Calculadora de Meta</h1>
        <p class="subtitle">Faça o upload das planilhas para processar os dados de todos os vendedores.</p>

        <form id="uploadForm" action="/processar" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="meta_file">Planilha "Meta vendedores" (.xlsx)</label>
                <input type="file" id="meta_file" name="meta_file" accept=".xlsx, .xls" required>
            </div>

            <div class="form-group">
                <label for="vendas_file">Planilha "Vendas_grupo" (.xlsx)</label>
                <input type="file" id="vendas_file" name="vendas_file" accept=".xlsx, .xls" required>
            </div>

            <button type="submit">Processar e Gerar Relatórios</button>
        </form>
    </div>

</body>
</html>
